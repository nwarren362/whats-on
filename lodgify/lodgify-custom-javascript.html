<script type="text/javascript">
(function () {
  "use strict";

  // Public browser credentials. The publishable key is intentionally safe
  // to expose here; Supabase Row Level Security controls what visitors see.
  const SUPABASE_URL = "https://jrluybdxwzyyrinfrbly.supabase.co";
  const SUPABASE_KEY = "sb_publishable_h2Rmdew3NOjixyoqTxfgpA_1EuPI9na";

  /* ======================================================================
     SECTION 1 — PAGE SETUP AND DISPLAY SETTINGS
     ====================================================================== */
  const feed = document.getElementById("jasmin-events");
  if (!feed) return;

  const PRIMARY_WINDOW_DAYS = 28;

  const dateFormatter = new Intl.DateTimeFormat("fr-FR", {
    timeZone: "Europe/Paris",
    weekday: "long",
    day: "numeric",
    month: "long"
  });

  const timeFormatter = new Intl.DateTimeFormat("fr-FR", {
    timeZone: "Europe/Paris",
    hour: "2-digit",
    minute: "2-digit"
  });

  const weekdayFormatter = new Intl.DateTimeFormat("fr-FR", {
    timeZone: "Europe/Paris",
    weekday: "long"
  });

  /* ======================================================================
     SECTION 2 — FRENCH DATE AND RECURRENCE FORMATTING
     ====================================================================== */
  function formatEventDate(startAt, endAt) {
    if (!startAt) return "Date à confirmer";

    const start = new Date(startAt);
    let label = dateFormatter.format(start);
    const localTime = start.toLocaleTimeString("fr-FR", {
      timeZone: "Europe/Paris",
      hour: "2-digit",
      minute: "2-digit"
    });

    if (localTime !== "00:00") label += ` à ${timeFormatter.format(start)}`;

    if (endAt) {
      const end = new Date(endAt);
      const options = { timeZone: "Europe/Paris" };
      const sameDay = start.toLocaleDateString("fr-FR", options) ===
        end.toLocaleDateString("fr-FR", options);
      label += sameDay
        ? `–${timeFormatter.format(end)}`
        : ` – ${dateFormatter.format(end)}`;
    }

    return label.charAt(0).toUpperCase() + label.slice(1);
  }

  function formatEventSchedule(event) {
    if (event.recurrence_frequency !== "weekly" || !event.start_at || !event.recurrence_until) {
      return formatEventDate(event.start_at, event.end_at);
    }

    const start = new Date(event.start_at);
    const weekday = weekdayFormatter.format(start);
    let label = `Tous les ${weekday}s`;
    const localTime = start.toLocaleTimeString("fr-FR", {
      timeZone: "Europe/Paris", hour: "2-digit", minute: "2-digit"
    });
    if (localTime !== "00:00") label += ` à ${timeFormatter.format(start)}`;
    if (event.end_at) label += `–${timeFormatter.format(new Date(event.end_at))}`;
    label += ` jusqu’au ${dateFormatter.format(new Date(event.recurrence_until))}`;
    return label;
  }

  function nextOccurrence(event, now = new Date()) {
    if (!event.start_at) return null;
    const first = new Date(event.start_at);
    if (event.recurrence_frequency !== "weekly" || !event.recurrence_until || now <= first) return first;

    const week = 7 * 24 * 60 * 60 * 1_000;
    const duration = event.end_at
      ? Math.max(new Date(event.end_at).valueOf() - first.valueOf(), 0)
      : 24 * 60 * 60 * 1_000;
    const completedWeeks = Math.floor((now.valueOf() - first.valueOf()) / week);
    const current = new Date(first.valueOf() + completedWeeks * week);
    const next = now.valueOf() <= current.valueOf() + duration
      ? current
      : new Date(current.valueOf() + week);
    return next <= new Date(event.recurrence_until) ? next : null;
  }

  function createTextElement(tag, className, text) {
    const element = document.createElement(tag);
    element.className = className;
    element.textContent = text;
    return element;
  }

  /* ======================================================================
     SECTION 3 — IMAGE POP-UP (LIGHTBOX)
     ====================================================================== */
  function openImageLightbox(source, title) {
    let dialog = document.querySelector(".event-lightbox");
    if (!dialog) {
      dialog = document.createElement("dialog");
      dialog.className = "event-lightbox";

      const close = document.createElement("button");
      close.type = "button";
      close.className = "event-lightbox__close";
      close.textContent = "×";
      close.setAttribute("aria-label", "Fermer l’image agrandie");
      close.addEventListener("click", () => dialog.close());

      const enlarged = document.createElement("img");
      enlarged.className = "event-lightbox__image";
      dialog.append(close, enlarged);
      dialog.addEventListener("click", event => {
        if (event.target === dialog) dialog.close();
      });
      document.body.appendChild(dialog);
    }

    const enlarged = dialog.querySelector(".event-lightbox__image");
    enlarged.src = source;
    enlarged.alt = `Affiche agrandie : ${title}`;
    dialog.showModal();
  }

  /* ======================================================================
     SECTION 4 — EVENT CARD CONTENT AND LINKS
     ====================================================================== */
  function createEventCard(event) {
    const article = document.createElement("article");
    article.className = "event-card";
    if (event.featured) article.classList.add("event-card--featured");

    if (event.image_url) {
      const imageButton = document.createElement("button");
      imageButton.type = "button";
      imageButton.className = "event-card__image-button";
      imageButton.setAttribute("aria-label", `Agrandir l’affiche de ${event.title}`);

      const image = document.createElement("img");
      image.className = "event-card__image";
      image.src = event.image_url;
      image.alt = `Affiche : ${event.title}`;
      image.loading = "lazy";
      image.addEventListener("error", () => imageButton.remove(), { once: true });
      imageButton.addEventListener("click", () => openImageLightbox(event.image_url, event.title));
      imageButton.appendChild(image);
      article.appendChild(imageButton);
    }

    const content = document.createElement("div");
    content.className = "event-card__content";

    const categoryName = event.categories && event.categories.name;
    if (categoryName) {
      content.appendChild(createTextElement("p", "event-card__category", categoryName));

    content.appendChild(createTextElement("h2", "event-card__title", event.title));

    const details = document.createElement("p");
    details.className = "event-card__details";
    const date = document.createElement("time");
    const nextDate = nextOccurrence(event);
    date.dateTime = nextDate?.toISOString() || event.start_at || "";
    date.textContent = formatEventSchedule(event);
    details.appendChild(date);
    if (event.location_name) details.append(" · ", event.location_name);
    content.appendChild(details);

    if (event.description) {
      content.appendChild(createTextElement("p", "event-card__description", event.description));
    }

    if (event.source_url) {
      const link = document.createElement("a");
      link.className = "event-card__link";
      link.href = event.source_url;
      link.target = "_blank";
      link.rel = "noopener noreferrer";
      link.textContent = "Voir les détails";
      link.setAttribute("aria-label", `Voir les détails de ${event.title}`);
      content.appendChild(link);
    }

    article.appendChild(content);
    return article;
  }

  function showMessage(message, isError) {
    feed.replaceChildren(createTextElement(
      "p",

  /* ======================================================================
     SECTION 5 — 28-DAY WINDOW AND LATER EVENTS
     ====================================================================== */
  function isInPrimaryWindow(event) {
    if (event.featured || !event.start_at) return true;
    const cutoff = new Date();
    cutoff.setDate(cutoff.getDate() + PRIMARY_WINDOW_DAYS);
    cutoff.setHours(23, 59, 59, 999);
    const next = nextOccurrence(event);
    return next !== null && next <= cutoff;
  }

  function createLaterEvents(events) {
    const section = document.createElement("details");
    section.className = "later-events";

    const summary = document.createElement("summary");
    summary.className = "later-events__summary";
    summary.textContent = `Voir les événements à venir plus tard (${events.length})`;
    section.appendChild(summary);

    const grid = document.createElement("div");
    grid.className = "later-events__grid";
    grid.append(...events.map(createEventCard));
    section.appendChild(grid);
    return section;
  }

  /* ======================================================================
     SECTION 6 — LOAD EVENTS FROM SUPABASE AND DISPLAY THEM
     ====================================================================== */
  async function loadEvents() {
    try {
      const fields = [
        "title", "description", "start_at", "end_at", "location_name",
        "source_url", "image_url", "featured", "recurrence_frequency",
        "recurrence_until", "categories(name,slug)"
      ].join(",");
      const response = await fetch(
        `${SUPABASE_URL}/rest/v1/events?select=${fields}&order=featured.desc,start_at.asc`,
        {
          headers: {
            apikey: SUPABASE_KEY,
            Authorization: `Bearer ${SUPABASE_KEY}`
          }
        }
      );

      if (!response.ok) throw new Error(`Supabase returned ${response.status}`);
      const events = await response.json();

      events.sort((left, right) => {
        if (left.featured !== right.featured) return left.featured ? -1 : 1;
        const leftDate = nextOccurrence(left)?.valueOf() ?? Number.MAX_SAFE_INTEGER;
        const rightDate = nextOccurrence(right)?.valueOf() ?? Number.MAX_SAFE_INTEGER;
        return leftDate - rightDate;
      });

      if (!events.length) {
        showMessage("Aucun événement n’est publié pour le moment.", false);
        return;
      }

      const primaryEvents = events.filter(isInPrimaryWindow);
      const laterEvents = events.filter(event => !isInPrimaryWindow(event));
      const content = primaryEvents.map(createEventCard);

      if (!primaryEvents.length) {
        content.push(createTextElement(
          "p",
          "feed-message",
          `Aucun événement n’est publié dans les ${PRIMARY_WINDOW_DAYS} prochains jours.`
        ));
      }
      if (laterEvents.length) content.push(createLaterEvents(laterEvents));
      feed.replaceChildren(...content);
    } catch (error) {
      console.error("Impossible de charger le flux Jasmin Cottage.", error);
      showMessage("Les événements ne peuvent pas être chargés pour le moment.", true);
    }
  }

  /* ======================================================================
     SECTION 7 — START THE PUBLIC FEED
     ====================================================================== */
  loadEvents();
})();

  async function loadSources(){const data=await api("/api/sources"),rank={high:0,normal:1,low:2};state.sources=data.sources.sort((left,right)=>Number(right.lifecycle_status==="review")-Number(left.lifecycle_status==="review")||(rank[left.priority]??9)-(rank[right.priority]??9)||left.name.localeCompare(right.name,"fr"));const reviewCount=state.sources.filter(source=>source.lifecycle_status==="review").length;$("[data-ja-section='sources']").textContent=reviewCount?"Sources ("+reviewCount+" to review)":"Sources";$("[data-ja-sources-loading]").hidden=true;renderSources();}

    const source=id?state.sources.find(item=>item.id===id):null;state.currentSource=source||null;
    $("[data-ja-source-title]").textContent=source?source.name:"Add source";
    $("#ja-source-name").value=source?.name||"";$("#ja-source-link").value=source?.url||"";$("[data-ja-open-source-record]").href=source?.url||"#";$("[data-ja-open-source-record]").hidden=!source?.url;$("#ja-source-type").value=source?.source_type||"other";$("#ja-source-lifecycle").value=source?.lifecycle_status||"verified";$("#ja-source-priority").value=source?.priority||"normal";$("#ja-source-area").value=source?.area||"";$("#ja-source-notes").value=source?.notes||"";$("#ja-source-access-notes").value=source?.access_notes||"";$("#ja-source-added-by").value=source?.added_by||"Nigel";$("#ja-source-review-reason").value=source?.review_reason||"";updateSourceReviewFields();$("[data-ja-delete-source]").hidden=!source;$("[data-ja-source-message]").textContent="";$("[data-ja-source-editor]").showModal();
  }
  function updateSourceReviewFields(){$("[data-ja-review-reason]").hidden=$("#ja-source-lifecycle").value!=="review";}
  function sourcePayload(){const lifecycle=$("#ja-source-lifecycle").value;return{name:$("#ja-source-name").value.trim(),url:$("#ja-source-link").value.trim(),source_type:$("#ja-source-type").value,lifecycle_status:lifecycle,priority:$("#ja-source-priority").value,area:$("#ja-source-area").value.trim(),notes:$("#ja-source-notes").value.trim(),access_notes:$("#ja-source-access-notes").value.trim(),added_by:$("#ja-source-added-by").value.trim(),review_reason:lifecycle==="review"?$("#ja-source-review-reason").value.trim():"",discovered_from_event_id:state.currentSource?.discovered_from_event_id||null,last_checked_at:state.currentSource?.last_checked_at||null,last_useful_at:state.currentSource?.last_useful_at||null};}
  async function saveSource(){const message=$("[data-ja-source-message]");message.textContent="Saving…";try{const path=state.currentSource?"/api/sources/"+state.currentSource.id:"/api/sources";await api(path,{method:state.currentSource?"PATCH":"POST",body:JSON.stringify(sourcePayload())});message.textContent="";$("[data-ja-source-editor]").close();showToast("Source saved.");await loadSources();}catch(error){message.textContent=error.message;}}
  async function deleteSource(){if(!state.currentSource)return;const name=state.currentSource.name;if(!window.confirm('Delete “'+name+'”?\n\nThis source will be removed permanently. The published event will not be deleted.'))return;const message=$("[data-ja-source-message]");message.textContent="Deleting…";try{const data=await api("/api/sources/"+state.currentSource.id,{method:"DELETE"});message.textContent="";$("[data-ja-source-editor]").close();showToast("Source deleted.");await loadSources();}catch(error){message.textContent=error.message;}}

  /* ======================================================================
     SECTION 6 — EVENT EDITOR AND AUTOMATIC DATE DEFAULTS
     ====================================================================== */
  async function load() {
    const data=await api("/api/events"); state={...state,...data};
    setOptions("#ja-category_id",state.categories); setOptions("#ja-status_id",state.statuses);
    $("[data-ja-loading]").hidden=true; render();
  }
  function openEditor(id) {
    const event=state.events.find(item=>item.id===id); if(!event)return; state.current=event;
    $("[data-ja-form-title]").textContent=event.title;
    fields.forEach(name=>{const element=$("#ja-"+name);if(name==="featured")element.checked=!!event[name];else if(timestampFields.includes(name))element.value=toLocal(event[name]);else if(name==="recurrence_frequency")element.value=event[name]||"none";else element.value=event[name]??"";});
    automaticDates={end:!event.end_at,expires:!event.expires_at};
    applyDateDefaults();
    updateRecurrenceFields();
    if(!event.facebook_message&&!event.facebook_post_id)$("#ja-facebook_message").value=facebookSuggestion();
    $("#ja-post-facebook").checked=!event.facebook_post_id;
    renderFacebookPanel();
    updateImageControls();
    $("[data-ja-open-source]").href=event.source_url||"#"; $("[data-ja-open-source]").hidden=!event.source_url; $("[data-ja-form-message]").textContent=""; $("[data-ja-editor]").showModal();
    checkImageUrl();
  }
  function payload(){const data={};fields.forEach(name=>{const element=$("#ja-"+name);data[name]=name==="featured"?element.checked:timestampFields.includes(name)?toIso(element.value):element.value.trim();});if(data.recurrence_frequency==="none")data.recurrence_until=null;return data;}
  function applyDateDefaults(){
    const start=$("#ja-start_at").value,end=$("#ja-end_at");
    if(start&&(!end.value||automaticDates.end)){end.value=addHours(start,2);automaticDates.end=true;}
    applyExpiryDefault();
  }
  function applyExpiryDefault(){
    const expiry=$("#ja-expires_at"),end=$("#ja-end_at").value;
    if(end&&(!expiry.value||automaticDates.expires)){expiry.value=end;automaticDates.expires=true;}
  }
  function updateRecurrenceFields(){const weekly=$("#ja-recurrence_frequency").value==="weekly";$("[data-ja-recurrence-until]").hidden=!weekly;$("#ja-recurrence_until").required=weekly;}
  function statusId(slug){return state.statuses.find(item=>item.slug===slug)?.id||"";}
  async function saveWithStatus(slug,{close=true}={}){const message=$("[data-ja-form-message]"),data=payload();data.status_id=statusId(slug);message.textContent="Saving…";try{await api("/api/events/"+state.current.id,{method:"PATCH",body:JSON.stringify(data)});await load();state.current=state.events.find(item=>item.id===state.current.id)||state.current;message.textContent="";if(close)$("[data-ja-editor]").close();showToast(slug==="draft"?"Draft saved.":slug==="archived"?"Event archived.":"Event published.");return true;}catch(error){message.textContent=error.message;return false;}}
  async function signIn(candidate){token=candidate;await load();if($("#ja-remember")?.checked)localStorage.setItem(TOKEN_KEY,token);else sessionStorage.setItem(TOKEN_KEY,token);$("[data-ja-login]").hidden=true;$("[data-ja-app]").hidden=false;capturePrefill().catch(error=>showToast(error.message));}

  /* ======================================================================
     SECTION 7 — FACEBOOK CAPTION PREVIEW AND PUBLICATION
     ====================================================================== */
  function facebookPostUrl(postId){const parts=String(postId||"").split("_");return parts.length===2?"https://www.facebook.com/"+encodeURIComponent(parts[0])+"/posts/"+encodeURIComponent(parts[1]):"https://www.facebook.com/"+encodeURIComponent(postId||"");}
  function facebookDateText(){
    const start=$("#ja-start_at").value;if(!start)return "Date à confirmer";
    const date=new Date(start),datePart=new Intl.DateTimeFormat("fr-FR",{weekday:"long",day:"numeric",month:"long",timeZone:"Europe/Paris"}).format(date),timePart=new Intl.DateTimeFormat("fr-FR",{hour:"2-digit",minute:"2-digit",timeZone:"Europe/Paris"}).format(date).replace(":","h");
    if($("#ja-recurrence_frequency").value==="weekly"&&$("#ja-recurrence_until").value){const until=new Intl.DateTimeFormat("fr-FR",{day:"numeric",month:"long",timeZone:"Europe/Paris"}).format(new Date($("#ja-recurrence_until").value));return "Chaque "+datePart.split(" ")[0]+" à "+timePart+", jusqu’au "+until;}
    return datePart.charAt(0).toUpperCase()+datePart.slice(1)+" à "+timePart;
  }
  function facebookSuggestion(){
    const title=$("#ja-title").value.trim()||state.current?.title||"Événement local",description=$("#ja-description").value.trim(),location=$("#ja-location_name").value.trim();
    return ["✨ "+title,"","📅 "+facebookDateText(),location?"📍 "+location:"",description?"\n"+description:"","","👉 Retrouvez cet événement et nos autres idées locales :","https://jasmin-cottage.com/fr/agenda-local"].filter(line=>line!=="").join("\n");
  }
  function updateImageControls(){
    const value=$("#ja-image_url").value.trim(),link=$("[data-ja-open-image]"),statusLine=$("[data-ja-image-status]");
    link.href=value||"#";link.hidden=!value;
    if(!value){statusLine.textContent="No image — Facebook will publish a deliberate text-only post.";statusLine.className="ja-image-status";return;}
    const temporary=/\.fbcdn\.net\b/i.test(value);statusLine.textContent=temporary?"Temporary Facebook image — checking…":"Checking image…";statusLine.className="ja-image-status checking";
  }
  async function checkImageUrl(){
    const value=$("#ja-image_url").value.trim(),statusLine=$("[data-ja-image-status]");
    updateImageControls();
    try{
      await api("/api/events/"+state.current.id+"/image-check",{method:"POST",body:JSON.stringify({image_url:value})});
      state.current.facebook_publish_error=null;const stored=state.events.find(event=>event.id===state.current.id);if(stored)stored.facebook_publish_error=null;
      statusLine.textContent=value?(/\.fbcdn\.net\b/i.test(value)?"Image works now, but this Facebook address is temporary.":"Image is working."):"No image — Facebook will publish a deliberate text-only post.";statusLine.className="ja-image-status valid";return true;
    }catch(error){state.current.facebook_publish_error=error.message;const stored=state.events.find(event=>event.id===state.current.id);if(stored)stored.facebook_publish_error=error.message;statusLine.textContent=error.message;statusLine.className="ja-image-status invalid";return false;}
  }
  function renderFacebookPanel(){
    const event=state.current,published=!!event?.facebook_post_id,agendaPublished=status(event)==="published",ready=$("[data-ja-facebook-ready]");
    ready.hidden=published;
    $("[data-ja-facebook-published]").hidden=!published;
    $("[data-ja-facebook-status]").textContent=published?"Posted":event?.facebook_publish_error?"Needs attention":"Ready";
    $("[data-ja-facebook-message]").textContent=event?.facebook_publish_error||"";
    $("[data-ja-save-draft]").hidden=agendaPublished;
    updatePrimaryAction();
    if(published){$("[data-ja-facebook-date]").textContent=dateLabel(event.facebook_published_at);$("[data-ja-facebook-link]").href=facebookPostUrl(event.facebook_post_id);}
  }
  function updatePrimaryAction(){const event=state.current,postToFacebook=$("#ja-post-facebook").checked&&!event?.facebook_post_id,published=status(event)==="published";$("[data-ja-publish-event]").textContent=postToFacebook?(published?"Save changes and post to Facebook":"Publish to website and Facebook"):(published?"Save changes":"Publish to website");}
  async function publishFacebook(){
    if(!state.current||state.current.facebook_post_id)return true;
    const message=$("#ja-facebook_message").value.trim(),notice=$("[data-ja-facebook-message]"),button=$("[data-ja-publish-event]");
    if(!message){notice.textContent="Add a caption before posting.";return false;}
    notice.textContent="Posting to Facebook…";button.disabled=true;
    try{
      const response=await fetch(FACEBOOK_API,{method:"POST",headers:{"Content-Type":"application/json","X-Capture-Token":token},body:JSON.stringify({action:"publish-event",event_id:state.current.id,message,confirmation:"PUBLISH EVENT"})});
      const data=await response.json();if(!response.ok)throw new Error(data.error||"Could not post to Facebook");
      state.current.facebook_message=message;state.current.facebook_post_id=data.post_id;state.current.facebook_published_at=data.event.facebook_published_at;notice.textContent="";renderFacebookPanel();showToast("Posted to Facebook.");
      const stored=state.events.find(event=>event.id===state.current.id);if(stored)Object.assign(stored,state.current);
      return true;
    }catch(error){state.current.facebook_publish_error=error.message;notice.textContent=error.message;renderFacebookPanel();return false;}finally{button.disabled=false;}
  }
  async function publishWorkflow(){
    const form=$("[data-ja-form]");if(!form.reportValidity())return;
    const wantsFacebook=$("#ja-post-facebook").checked&&!state.current.facebook_post_id;
    if(wantsFacebook){const imageWorks=await checkImageUrl();if(!imageWorks){$("[data-ja-form-message]").textContent="Replace the image link, or remove it to publish a deliberate text-only Facebook post.";return;}}
    const saved=await saveWithStatus("published",{close:false});if(!saved)return;
    if(wantsFacebook){const posted=await publishFacebook();if(!posted)return;await load();}
    $("[data-ja-editor]").close();showToast(wantsFacebook?"Published to the website and Facebook.":"Published to the website.");
  }

  /* ======================================================================
     SECTION 8 — BUTTONS, FORMS AND OTHER USER ACTIONS
     ====================================================================== */
  $("[data-ja-login-form]").addEventListener("submit",async event=>{event.preventDefault();const message=$("[data-ja-login-message]");message.textContent="Signing in…";try{await signIn($("#ja-token").value);message.textContent="";}catch(error){token="";message.textContent="Incorrect code or connection failed.";}});
  $("[data-ja-logout]").addEventListener("click",()=>{localStorage.removeItem(TOKEN_KEY);sessionStorage.removeItem(TOKEN_KEY);location.reload();});
  $("[data-ja-filters]").addEventListener("click",event=>{const button=event.target.closest("[data-filter]");if(button){state.filter=button.dataset.filter;if(state.filter==="draft")state.facebookFilter="all";render();}});
  $("#ja-event-search").addEventListener("input",event=>{state.eventSearch=event.target.value;render();});
  $("#ja-event-sort").addEventListener("change",event=>{state.eventSort=event.target.value;render();});
  $("#ja-facebook-filter").addEventListener("change",event=>{state.facebookFilter=event.target.value;render();});
  root.querySelectorAll("[data-ja-section]").forEach(button=>button.addEventListener("click",()=>showSection(button.dataset.jaSection)));
  $("[data-ja-source-filters]").addEventListener("click",event=>{const button=event.target.closest("[data-source-filter]");if(button){state.sourceFilter=button.dataset.sourceFilter;renderSources();}});
  $("[data-ja-new-source]").addEventListener("click",()=>openSourceEditor());
  $("[data-ja-source-list]").addEventListener("click",event=>{const card=event.target.closest("[data-source-id]");if(card)openSourceEditor(card.dataset.sourceId);});
  $("[data-ja-source-close]").addEventListener("click",()=>$("[data-ja-source-editor]").close());
  $("[data-ja-source-form]").addEventListener("submit",event=>{event.preventDefault();saveSource();});
  $("#ja-source-lifecycle").addEventListener("change",updateSourceReviewFields);
  $("#ja-source-link").addEventListener("input",event=>{$("[data-ja-open-source-record]").href=event.target.value||"#";$("[data-ja-open-source-record]").hidden=!event.target.value;});
  $("[data-ja-delete-source]").addEventListener("click",deleteSource);
  $("[data-ja-list]").addEventListener("click",event=>{const card=event.target.closest("[data-id]");if(card)openEditor(card.dataset.id);});
  $("[data-ja-close]").addEventListener("click",()=>$("[data-ja-editor]").close());
  $("[data-ja-form]").addEventListener("submit",event=>{event.preventDefault();publishWorkflow();});
  $("#ja-source_url").addEventListener("input",event=>{$("[data-ja-open-source]").href=event.target.value||"#";$("[data-ja-open-source]").hidden=!event.target.value;});
  $("#ja-image_url").addEventListener("input",updateImageControls);
  $("#ja-image_url").addEventListener("change",checkImageUrl);
  $("#ja-post-facebook").addEventListener("change",updatePrimaryAction);
  $("#ja-start_at").addEventListener("change",applyDateDefaults);
  $("#ja-end_at").addEventListener("input",()=>{automaticDates.end=false;if(!$("#ja-expires_at").value||automaticDates.expires)applyExpiryDefault();});
  $("#ja-expires_at").addEventListener("input",()=>{automaticDates.expires=false;});
  $("#ja-recurrence_frequency").addEventListener("change",updateRecurrenceFields);
  $("[data-ja-generate-facebook]").addEventListener("click",()=>{$("#ja-facebook_message").value=facebookSuggestion();});
  $("[data-ja-save-draft]").addEventListener("click",()=>saveWithStatus("draft"));
  $("[data-ja-bookmarklet]").href="javascript:("+desktopCaptureBookmarklet.toString()+")()";
  $("[data-ja-archive]").addEventListener("click",()=>saveWithStatus("archived"));
  if(token) signIn(token).catch(()=>{localStorage.removeItem(TOKEN_KEY);sessionStorage.removeItem(TOKEN_KEY);});
})();
</script>
